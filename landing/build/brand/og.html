<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Rendered by build/brand/render.mjs. Mirrors tokens.css (ink theme). */
  @font-face { font-family: 'Inter'; src: url('../../../app/resources/fonts/inter-latin-wght-normal.woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('../../../app/resources/fonts/geist-mono-latin-400-normal.woff2'); }
  :root { --bg:#f7f5f0; --fg:#1a1814; --muted:#57524a; --accent:#0f766e; --a1:#14b8a6; --a3:#a78bfa; }
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; background:var(--bg); color:var(--fg); font-family:Inter, sans-serif; position:relative; }
  .glow { position:absolute; inset:-30%; background:
      radial-gradient(30% 35% at 78% 38%, rgb(20 184 166 / .18), transparent 70%),
      radial-gradient(25% 30% at 92% 80%, rgb(167 139 250 / .14), transparent 70%); filter: blur(20px); }
  .grid { position:absolute; inset:0; background-image: linear-gradient(rgb(26 24 20 / .06) 1px, transparent 1px), linear-gradient(90deg, rgb(26 24 20 / .06) 1px, transparent 1px); background-size: 48px 48px; mask: radial-gradient(70% 80% at 30% 50%, #000, transparent); }
  .wrap { position:absolute; inset:72px 80px; display:flex; flex-direction:column; justify-content:space-between; }
  .mark { font-weight:650; letter-spacing:-.03em; font-size:40px; }
  h1 { font-weight:600; font-size:96px; line-height:1.02; letter-spacing:-.045em; }
  h1 em { font-style:normal; color: var(--accent); }
  .foot { display:flex; gap:28px; align-items:center; font-size:22px; color:var(--muted); }
  .pill { font-family:'Geist Mono'; font-size:18px; padding:10px 16px; border-radius:999px; border:1px solid rgb(26 24 20 / .12); background:#fff; color: var(--fg); }
  .pill b { color: var(--accent); font-weight:400; }
</style>
</head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="wrap">
    <div class="mark">Resolvr</div>
    <h1>Finally heard.<br><em>Finally resolved.</em></h1>
    <div class="foot">
      <span class="pill"><b>INC-014</b> · timestamp locked</span>
      <span>Your evidence, your protection.</span>
    </div>
  </div>
</body>
</html>
