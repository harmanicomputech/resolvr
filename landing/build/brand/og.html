<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Rendered by build/brand/render.mjs. Mirrors tokens.css (ink theme). */
  @font-face { font-family: 'Instrument Serif'; src: url('../../../app/resources/fonts/instrument-serif-latin-400-normal.woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('../../../app/resources/fonts/instrument-serif-latin-400-italic.woff2'); }
  @font-face { font-family: 'Inter'; src: url('../../../app/resources/fonts/inter-latin-wght-normal.woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('../../../app/resources/fonts/geist-mono-latin-400-normal.woff2'); }
  :root { --bg:#07090d; --fg:#eceff3; --muted:#a3adba; --a1:#14b8a6; --a2:#22d3ee; --a3:#a78bfa; }
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; background:var(--bg); color:var(--fg); font-family:Inter, sans-serif; position:relative; }
  .glow { position:absolute; inset:-30%; background:
      radial-gradient(30% 35% at 70% 40%, rgb(20 184 166 / .45), transparent 70%),
      radial-gradient(28% 30% at 85% 70%, rgb(167 139 250 / .35), transparent 70%),
      radial-gradient(25% 30% at 55% 80%, rgb(34 211 238 / .25), transparent 70%); filter: blur(30px); }
  .grid { position:absolute; inset:0; background-image: linear-gradient(rgb(255 255 255 / .04) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .04) 1px, transparent 1px); background-size: 48px 48px; mask: radial-gradient(70% 80% at 30% 50%, #000, transparent); }
  .wrap { position:absolute; inset:72px 80px; display:flex; flex-direction:column; justify-content:space-between; }
  .mark { font-family:'Instrument Serif'; font-style:italic; font-size:44px; }
  h1 { font-family:'Instrument Serif'; font-weight:400; font-size:104px; line-height:.98; letter-spacing:-.015em; }
  h1 em { background: linear-gradient(100deg, var(--a1), var(--a2) 50%, var(--a3)); -webkit-background-clip:text; color:transparent; }
  .foot { display:flex; gap:28px; align-items:center; font-size:22px; color:var(--muted); }
  .pill { font-family:'Geist Mono'; font-size:18px; padding:10px 16px; border-radius:999px; border:1px solid rgb(255 255 255 / .14); background: rgb(13 17 23 / .6); color: var(--fg); }
  .pill b { color: var(--a2); font-weight:400; }
</style>
</head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="wrap">
    <div class="mark">Resolvr</div>
    <h1>Finally heard.<br><em>Finally resolved.</em></h1>
    <div class="foot">
      <span class="pill"><b>INC-014</b> · timestamp locked</span>
      <span>Your evidence, your protection.</span>
    </div>
  </div>
</body>
